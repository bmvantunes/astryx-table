packages:
  - packages/*

# The upstream script only prints an agent-setup reminder; no build is required.
allowBuilds:
  "@astryxdesign/core": false
  msgpackr-extract: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8

minimumReleaseAgeExclude:
  - "@astryxdesign/core@0.6.5"
  - "@astryxdesign/theme-neutral@0.6.5"

overrides:
  vite: "catalog:"

patchedDependencies:
  "@astryxdesign/core@0.6.5": patches/@astryxdesign__core@0.6.5.patch
  "@stylexjs/unplugin@0.19.0": patches/@stylexjs__unplugin@0.19.0.patch

peerDependencyRules:
  allowedVersions:
    vite: "*"
